<style>
  * {
    box-sizing: border-box;
  }

  /* I was so arrogant. */

  /* https://www.w3schools.com/css/css3_variables.asp */
  :root {
    --bustelo-red: rgb(229, 0, 63);
    --bustelo-yellow: rgb(255, 217, 11);
    --bustelo-blue: rgb(15, 27, 152);
    --vertical-offset: 20px;
    --frame-width: 700px;
    /* will come in handy later calc() */
  }

  /* https://stackoverflow.com/questions/57098732/repeating-vertical-lines-using-css */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .frame {
    /* for those repeating triangles */
    background-size: var(--frame-width);
    background-color: var(--bustelo-yellow);
    position: relative;
    width: var(--frame-width);
    height: 500px;
    border: 0px dashed;
  }
  
  .stripes { 
    /* https://stackoverflow.com/questions/57098732/repeating-vertical-lines-using-css */
    position: absolute;
    width: var(--frame-width);
    height: 500px;
    background: linear-gradient(to right, var(--bustelo-yellow) 3px, transparent 1px);
    background-size: 10px;
  }

  .triangle.foreground {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    width: 500px;
    height: 500px;
    background: var(--bustelo-red);
    clip-path: polygon(50% 100%, 100% 0%, 0% 0%);
  }
  
  .triangle.background {
    position: absolute;
    left: 0px;
    width: var(--frame-width);
    height: 500px;
    background: var(--bustelo-blue);
    clip-path: polygon(50% 15%, 100% 60%, 0% 60%);
  }

  .pentagon {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    width: 500px;
    height: 460px;
    bottom: 12px;
    background-color: var(--bustelo-yellow);
    clip-path: polygon(18% 30%, 50% 100%, 82% 30%, 60% 70%, 40% 70%);
  }

  .hairstyle {
    /* https://css-generators.com/blob/ */
    background-color: var(--bustelo-blue);
    position: absolute;
    width: 170px;
    top: 5px;
    left: calc((var(--frame-width) - 170px)/2);
    aspect-ratio: 0.92;
    clip-path: shape(from 27.39% 86.82%, curve to 20.99% 83.87% with 24.85% 84.62%, smooth to 14.19% 80.87%, smooth to 12.84% 73.63%, smooth to 11.69% 66.34%, smooth to 6.61% 61.09%, smooth to 2.42% 54.64%, smooth to 5.45% 47.97%, smooth to 6.34% 40.46%, smooth to 5.79% 33.54%, smooth to 13.48% 29.68%, smooth to 18.77% 25.32%, smooth to 21.67% 19.57%, smooth to 25.46% 13.74%, smooth to 30.51% 9.06%, smooth to 37.41% 8.55%, smooth to 44.25% 7.82%, smooth to 50.87% 3.96%, smooth to 57.85% 3.44%, smooth to 63.85% 7.98%, smooth to 68.74% 13.37%, smooth to 72.92% 18.33%, smooth to 79.68% 20.50%, smooth to 88.32% 21.90%, smooth to 90.20% 28.59%, smooth to 92.18% 35.81%, smooth to 94.68% 41.89%, smooth to 92.18% 48.94%, smooth to 93.61% 55.95%, smooth to 92.45% 62.13%, smooth to 86.11% 66.74%, smooth to 83.16% 72.35%, smooth to 79.63% 77.08%, smooth to 74.60% 80.88%, smooth to 69.55% 83.88%, smooth to 63.75% 85.74%, smooth to 58.34% 88.60%, smooth to 52.45% 91.99%, smooth to 46.04% 93.26%, smooth to 39.32% 92.46%, smooth to 32.92% 90.65%, smooth to 27.39% 86.82%);
  }

  .hairstyle-contour {
    background-color: var(--bustelo-yellow);
    rotate: 0deg;
    position: absolute;
    width: 185px;
    top: 0px;
    left: calc((var(--frame-width) - 185px)/2);
    aspect-ratio: 0.95;
    clip-path: shape(from 27.39% 86.82%, curve to 20.99% 83.87% with 24.85% 84.62%, smooth to 14.19% 80.87%, smooth to 12.84% 73.63%, smooth to 11.69% 66.34%, smooth to 6.61% 61.09%, smooth to 2.42% 54.64%, smooth to 5.45% 47.97%, smooth to 6.34% 40.46%, smooth to 5.79% 33.54%, smooth to 13.48% 29.68%, smooth to 18.77% 25.32%, smooth to 21.67% 19.57%, smooth to 25.46% 13.74%, smooth to 30.51% 9.06%, smooth to 37.41% 8.55%, smooth to 44.25% 7.82%, smooth to 50.87% 3.96%, smooth to 57.85% 3.44%, smooth to 63.85% 7.98%, smooth to 68.74% 13.37%, smooth to 72.92% 18.33%, smooth to 79.68% 20.50%, smooth to 88.32% 21.90%, smooth to 90.20% 28.59%, smooth to 92.18% 35.81%, smooth to 94.68% 41.89%, smooth to 92.18% 48.94%, smooth to 93.61% 55.95%, smooth to 92.45% 62.13%, smooth to 86.11% 66.74%, smooth to 83.16% 72.35%, smooth to 79.63% 77.08%, smooth to 74.60% 80.88%, smooth to 69.55% 83.88%, smooth to 63.75% 85.74%, smooth to 58.34% 88.60%, smooth to 52.45% 91.99%, smooth to 46.04% 93.26%, smooth to 39.32% 92.46%, smooth to 32.92% 90.65%, smooth to 27.39% 86.82%);

  }

  .face-contour {
    position: absolute;
    left: calc((var(--frame-width) - 100px)/2);
    top: 60px;
    width: 100px;
    height: 133px;
    bottom: 20px;
    background-color: var(--bustelo-blue);
    border-radius: 35% 15% 50% 50% / 20% 10% 65% 65%;
  }

  .face {
    position: absolute;
    left: calc((var(--frame-width) - 90px)/2);
    top: 65px;
    width: 90px;
    height: 124px;
    bottom: 20px;
    background-color: white;
    border-radius: 35% 15% 50% 50% / 20% 10% 65% 65%;
  }

  /* div grandparents? */
  .face.right-nostril {
    position: absolute;
    left: calc((var(--frame-width) - 12px)/2 + 4px);
    top: 138px;
    width: 12px;
    height: 4.5px;
    /* relative sizing would be helpful here */
    background-color: var(--bustelo-blue);
    border-radius: 80% 10% 50% 22% / 58% 29% 54% 22%;
  }

  .face.left-nostril {
    position: absolute;
    left: calc((var(--frame-width) - 4.5px)/2 - 6px);
    top: 138px;
    width: 4.5px;
    height: 4.5px;
    background-color: var(--bustelo-blue);
    border-radius: 50%;
  }

  .face.eye {
    position: absolute;
    background-color: var(--bustelo-blue);
    top: 110px;
    width: 8px;
    height: 8px;
    border-radius: 52% 48% 54% 46% / 62% 59% 41% 38%;
  }

  .face.eye::before {
    --offset: 2.5px;
    content: "";
    position: absolute;
    background-color: var(--bustelo-blue);
    left: var(--offset);
    bottom: -1px;
    /* relative to :: host element? */
    width: 14px;
    height: 11px;
    border-radius: 34% 51% 46% 35% / 41% 45% 36% 42%;
  }

  .face.eye::after {
    --offset: 5px;
    content: "";
    position: absolute;
    background-color: var(--bustelo-blue);
    left: 11px;
    width: 8px;
    height: 8px;
    border-radius: 52% 48% 54% 46% / 62% 59% 41% 38%;
  }

  .face.eye.left {
    left: calc((var(--frame-width) - 8px)/2 + 17px);
    top: 110px;
    z-index: 1;
  }

  .face.eye.lefteyeshadow {
    background-color: var(--bustelo-yellow);
    --offset: 2px;
    left: calc((var(--frame-width) - 8px)/2 + 17px);
    top: calc(110px - var(--offset));
    z-index: 0;
  }

  .face.eye.lefteyeshadow::before {
    background-color: var(--bustelo-yellow);
  }

  .face.eye.lefteyeshadow::after {
    background-color: var(--bustelo-yellow);
  }

  .face.eye.right {
    left: calc((var(--frame-width) - 8px)/2 - 27px);
    top: 110px;
    z-index: 1;
  }

  .face.eye.righteyeshadow {
    background-color: var(--bustelo-yellow);
    --offset: 2px;
    left: calc((var(--frame-width) - 8px)/2 - 27px);
    top: calc(110px - var(--offset));
    z-index: 0;
  }

  .face.eye.righteyeshadow::before {
    background-color: var(--bustelo-yellow);
  }

  .face.eye.righteyeshadow::after {
    background-color: var(--bustelo-yellow);
  }

  .face.lowerlips {
    width: 35px;
    height: 13px;
    top: 158px;
    left: calc((var(--frame-width) - 35px)/2);
    background-color: var(--bustelo-red);
    border-radius: 45% 36% 50% 50% / 0% 0% 100% 100%;
  }

  .face.upperlips-left {
    position: absolute;
    background-color: var(--bustelo-red);
    left: calc((var(--frame-width) - 8px)/2 + 3.5px);
    top: 152px;
    width: 8px;
    height: 8px;
    border-radius: 52% 48% 54% 46% / 62% 59% 41% 38%;
  }

  .face.upperlips-right {
    position: absolute;
    background-color: var(--bustelo-red);
    left: calc((var(--frame-width) - 8px)/2 - 3.5px);
    top: 152px;
    width: 8px;
    height: 8px;
    border-radius: 52% 48% 54% 46% / 62% 59% 41% 38%;
  }

  .neck-contour {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    width: 500px;
    height: 500px;
    z-index: 0;
    background-color: var(--bustelo-blue);
    clip-path: polygon(28% 50%, 40% 70%, 60% 70%, 72% 50%, 55% 45%, 55% 35%, 45% 35%, 45% 45%);
  }

  .neckline-left {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    clip-path: polygon(45% 35%, 46% 36%, 46% 45%, 45% 46%);
    width: 500px;
    height: 500px;
    background-color: var(--bustelo-blue);
  }

  .neckline-right {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    clip-path: polygon(55% 35%, 54% 37%, 54% 50%, 55% 50%);
    width: 500px;
    height: 500px;
    background-color: var(--bustelo-blue);
  }

  .neck {
    position: absolute;
    left: calc((var(--frame-width) - 500px)/2);
    top: 5px;
    width: 500px;
    height: 500px;
    background-color: white;
    clip-path: polygon(28% 50%, 40% 70%, 60% 70%, 72% 50%, 55% 45%, 55% 35%, 45% 35%, 45% 45%);
  }
  
  .hdmi-no-signal.blue {
    position: absolute;
    width: 460px;
    left: calc((var(--frame-width) - 460px)/2);
    top: 370px;
    padding: 5px 15px 5px 15px;
    font-family: monospace;
    border-radius: 10px;
    font-size: 50px;
    font-weight: bold;
    color: var(--bustelo-yellow);
    background-color: var(--bustelo-blue);
  }
  
</style>

<body>

  <div class="frame">
    <div class="triangle background"></div>
    <div class="stripes"></div>
    <div class="triangle foreground"></div>
    <div class="neck-contour"></div>
    <div class="neck"></div>
    <div class="neckline-left"></div>
    <div class="neckline-right"></div>
    <div class="pentagon"></div>
    <div class="hairstyle-contour"></div>
    <div class="hairstyle"></div>
    <div class="face-contour"></div>
    <div class="face"></div>
    <div class="face right-nostril"></div>
    <div class="face left-nostril"></div>
    <div class="face eye left"></div>
    <div class="face eye lefteyeshadow"></div>
    <div class="face eye right"></div>
    <div class="face eye righteyeshadow"></div>
    <div class="face lowerlips"></div>
    <div class="face upperlips-left"></div>
    <div class="face upperlips-right"></div>
    <div class="hdmi-no-signal blue">HDMI NO SIGNAL</div>

  </div>

</body>
